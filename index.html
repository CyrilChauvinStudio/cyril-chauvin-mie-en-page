<style>
/* Mise en page : table lumineuse (chrome sobre) + feuilles A4 blanches. Tout en Work Sans. */
:root{
  --table:#e8e7e4; --chrome:#f6f5f3; --ink:#111; --mute:#6d6b67; --line:#d3d1cc; --accent:#111; --hi:#2b5cff;
  --f:"Work Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--table:#1b1b1a;--chrome:#242423;--ink:#efeeea;--mute:#9b9993;--line:#3a3937;--accent:#efeeea;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--f);font-size:13px}
[hidden]{display:none!important}

/* ---------- barre d'outils ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand img{width:28px;height:28px}
.brand b{font-weight:600;letter-spacing:.14em;font-size:11px;text-transform:uppercase;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--mute);letter-spacing:.02em}
#docTitle{flex:1 1 180px;min-width:0;border:1px solid transparent;background:transparent;color:var(--ink);padding:7px 9px;border-radius:6px;font-size:14px;font-weight:500}
#docTitle:hover,#docTitle:focus{border-color:var(--line);outline:none;background:var(--table)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--accent);color:var(--chrome);border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.tag{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.15);display:grid;gap:2px;z-index:60}
.menu-pop button{display:flex;justify-content:space-between;gap:12px;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:5px;cursor:pointer}
.menu-pop button:hover{background:var(--table)}
.menu-pop small{color:var(--mute)}

/* ---------- plan de travail ---------- */
#desk{padding:24px 16px 120px;display:flex;flex-direction:column;align-items:center;gap:30px}
.sheet-wrap{display:flex;flex-direction:column;gap:8px;max-width:100%}
.sheet-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.sheet-tools .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sheet-tools .sp{flex:1}
.chip{border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:5px;padding:4px 8px;cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:default}
.zoomer{width:var(--zw);height:var(--zh)}
.page{transform-origin:0 0;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.12)}

/* ---------- la feuille (toujours papier blanc) ---------- */
.page{position:relative;width:var(--pw);height:var(--ph);background:#fff;color:#111;overflow:hidden;font-family:var(--f);display:flex;flex-direction:column;padding:var(--m) var(--m) 0}
.p-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:6mm}
.p-foot{height:14mm;display:flex;align-items:center;gap:3mm;border-top:.25mm solid #111;margin-top:6mm;font-size:7pt;letter-spacing:.18em;text-transform:uppercase;color:#111}
.p-foot img{width:5mm;height:5mm}
.p-foot .pn{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}
.p-foot .mid{color:#777;letter-spacing:.12em}

.eyebrow{font-size:7.5pt;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#777}
.h1{font-size:28pt;font-weight:300;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.h2{font-size:20pt;font-weight:300;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.body{font-size:10pt;font-weight:400;line-height:1.55;color:#222}
.body p{margin:0 0 3mm}
.cap{font-size:7.5pt;color:#666;letter-spacing:.02em;line-height:1.4}
.rule{height:.25mm;background:#111;width:14mm}

[contenteditable]{outline:none;border-radius:1mm;transition:box-shadow .15s}
[contenteditable]:hover{box-shadow:0 0 0 .4mm rgba(43,92,255,.25)}
[contenteditable]:focus{box-shadow:0 0 0 .5mm var(--hi)}
[contenteditable]:empty::before{content:attr(data-ph);color:#bbb}

/* images */
.ph{position:relative;overflow:hidden;background:#f0efed;min-height:0;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;color:#8a8883;font-size:8pt;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:4mm}
.ph .empty::before{content:"";width:9mm;height:9mm;border:.3mm solid #b5b3ae;border-radius:50%;background:linear-gradient(#b5b3ae,#b5b3ae) center/4mm .3mm no-repeat,linear-gradient(#b5b3ae,#b5b3ae) center/.3mm 4mm no-repeat}
.ph.sel{outline:.7mm solid var(--hi);outline-offset:-.7mm}
.ph:hover:not(.sel){outline:.4mm solid rgba(43,92,255,.4);outline-offset:-.4mm}

/* --- couverture --- */
.t-cover{padding:0}
.t-cover .ph{position:absolute;inset:0;cursor:pointer}
.t-cover .ov{position:absolute;inset:auto 0 0 0;padding:var(--m);padding-top:40mm;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;display:flex;flex-direction:column;gap:3mm;pointer-events:none}
.t-cover .ov [contenteditable]{pointer-events:auto}
.t-cover .ov .eyebrow{color:rgba(255,255,255,.8)}
.t-cover .ov .h1{font-size:38pt;font-weight:200}
.t-cover .ov .sub{font-size:12pt;font-weight:300;max-width:150mm}
.t-cover .ov .meta{display:flex;justify-content:space-between;align-items:end;gap:6mm;margin-top:4mm;padding-top:3mm;border-top:.25mm solid rgba(255,255,255,.6);font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase}
.t-cover .logo{position:absolute;top:var(--m);left:var(--m);display:flex;align-items:center;gap:3mm;color:#fff;font-size:7.5pt;letter-spacing:.24em;text-transform:uppercase;font-weight:500;pointer-events:none;mix-blend-mode:normal}
.t-cover .logo img{width:11mm;height:11mm;box-shadow:0 0 0 .4mm #fff;border-radius:50%}
.t-cover.noimg .ov{background:none;color:#111}
.t-cover.noimg .ov .eyebrow{color:#777}
.t-cover.noimg .ov .meta{border-color:#111}
.t-cover.noimg .logo{color:#111}

/* --- texte --- */
.t-text .p-body{gap:5mm;padding-top:6mm}
.t-text .body{columns:1;column-gap:10mm}
.landscape .t-text .body{columns:2}
.landscape .t-text .p-body{display:grid;grid-template-columns:85mm 1fr;grid-template-rows:auto 1fr;column-gap:12mm;align-content:start}
.landscape .t-text .hd{grid-row:1/3}

/* --- image pleine --- */
.t-full .ph{flex:1}

/* --- image + texte --- */
.t-split .p-body{display:grid;grid-template-rows:1.15fr auto;gap:7mm}
.t-split .tx{display:flex;flex-direction:column;gap:4mm}
.landscape .t-split .p-body{grid-template-rows:none;grid-template-columns:1.25fr 1fr;gap:10mm}
.landscape .t-split .tx{justify-content:flex-end;padding-bottom:2mm}
.t-split.rev .ph{order:2}
.landscape .t-split.rev .p-body{grid-template-columns:1fr 1.25fr}

/* --- grilles --- */
.t-g2 .grid{flex:1;display:grid;gap:5mm;grid-template-rows:1fr 1fr;min-height:0}
.landscape .t-g2 .grid{grid-template-rows:none;grid-template-columns:1fr 1fr}
.t-g2 .cell,.t-g4 .cell{display:flex;flex-direction:column;gap:2mm;min-height:0}
.t-g2 .cell .ph,.t-g4 .cell .ph{flex:1}
.t-g4 .grid{flex:1;display:grid;gap:4mm;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;min-height:0}

/* --- chiffres --- */
.t-fig .p-body{justify-content:center;gap:12mm}
.t-fig .figs{display:grid;grid-template-columns:1fr;gap:9mm}
.landscape .t-fig .figs{grid-template-columns:repeat(3,1fr);gap:10mm}
.t-fig .fig{border-top:.25mm solid #111;padding-top:4mm;display:flex;flex-direction:column;gap:2mm}
.t-fig .n{font-size:44pt;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.t-fig .l{font-size:9.5pt;line-height:1.45;color:#333;max-width:80mm}

/* --- citation --- */
.t-quote .p-body{justify-content:center;gap:8mm;padding:0 6mm}
.t-quote .q{font-size:24pt;font-weight:300;font-style:italic;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.landscape .t-quote .q{font-size:28pt;max-width:220mm}
.t-quote .mark{font-size:60pt;font-weight:200;line-height:.6;height:12mm}
.t-quote .who{font-size:8pt;letter-spacing:.2em;text-transform:uppercase}
.t-quote .role{font-size:9pt;color:#666}

/* --- contact --- */
.t-contact .p-body{justify-content:space-between;padding:10mm 0 4mm}
.t-contact .big{display:flex;align-items:center;gap:6mm}
.t-contact .big img{width:24mm;height:24mm}
.t-contact .big b{font-size:11pt;font-weight:500;letter-spacing:.28em;text-transform:uppercase}
.t-contact .lines{display:grid;gap:5mm}
.landscape .t-contact .lines{grid-template-columns:repeat(4,auto);justify-content:space-between}
.t-contact .ln{border-top:.25mm solid #111;padding-top:3mm;display:flex;flex-direction:column;gap:1.5mm;font-size:11pt;font-weight:300}
.t-contact .ln small{font-size:7pt;letter-spacing:.24em;text-transform:uppercase;color:#777;font-weight:500}
.t-contact .baseline{font-size:9pt;color:#666;letter-spacing:.02em}

/* ---------- inspecteur image ---------- */
#insp{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--chrome);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:12px 14px;display:grid;gap:10px}
#insp .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#insp label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex:1 1 140px}
#insp input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
#insp .ttl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-right:auto}

/* ---------- écran de départ ---------- */
#start{position:fixed;inset:0;z-index:100;background:var(--table);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.st{width:min(640px,100%);display:grid;gap:22px}
.st header{display:flex;align-items:center;gap:14px}
.st header img{width:44px;height:44px}
.st h1{margin:0;font-weight:300;font-size:28px;letter-spacing:-.01em}
.st p{margin:0;color:var(--mute);line-height:1.5}
.st .q{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.orients{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ori{border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:10px;padding:20px 14px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px}
.ori:hover{border-color:var(--ink)}
.ori[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ori .pg{background:#fff;border:1px solid #cfcdc8;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.ori .pg::after{content:"";position:absolute;left:12%;right:12%;bottom:10%;height:1px;background:#111}
.ori .pg i{position:absolute;left:12%;right:12%;top:12%;bottom:30%;background:#e4e3e0}
.ori b{font-weight:500}
.ori small{color:var(--mute);font-size:12px}
.st input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:8px;font-size:15px}
.st .go{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.resume{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.resume span{color:var(--mute);font-size:13px;flex:1}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:8px 14px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

/* réglages */
#settings{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#settings .box{background:var(--chrome);color:var(--ink);border-radius:12px;padding:20px;width:min(460px,100%);display:grid;gap:12px}
#settings h2{margin:0;font-weight:400;font-size:18px}
#settings label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
#settings input{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--table);color:var(--ink);font-size:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- impression / PDF ---------- */
@media print{
  html,body{background:#fff;height:auto}
  .bar,.sheet-tools,#insp,#start,#toast,#settings{display:none!important}
  #desk{padding:0;gap:0;display:block}
  .sheet-wrap{display:block;gap:0}
  .zoomer{width:auto!important;height:auto!important}
  .page{transform:none!important;box-shadow:none;break-after:page;page-break-after:always}
  .sheet-wrap:last-child .page{break-after:auto;page-break-after:auto}
  .ph .empty{display:none}
  .ph{background:transparent}
  .ph,.ph.sel,.ph:hover{outline:none!important}
  [contenteditable]{box-shadow:none!important}
  [contenteditable]:empty::before{content:""}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pagesize">@page{size:A4 portrait;margin:0}</style>

function moisAnnee(){return new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}

/* ---------- stockage (IndexedDB, repli silencieux) ---------- */
const DB={db:null,
  open(){return new Promise(r=>{try{const q=indexedDB.open("ccs-miseenpage",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  get(){return new Promise(r=>{try{const t=this.db.transaction("p").objectStore("p").get("current");t.onsuccess=()=>r(t.result||null);t.onerror=()=>r(null)}catch(e){r(null)}})},
  put(v){try{this.db.transaction("p","readwrite").objectStore("p").put(v,"current")}catch(e){}}
};
function save(){clearTimeout(saveT);saveT=setTimeout(()=>DB.put(JSON.parse(JSON.stringify(S))),400)}

function ed(pid,key,val,cls,ph,rich){return `<div class="${cls}" contenteditable="true" spellcheck="true" data-p="${pid}" data-k="${key}" ${rich?'data-rich="1"':''} data-ph="${esc(ph||"")}">${rich?(val||""):esc(val)}</div>`}
function ph(pid,key,o,label){const has=o&&o.src;const z=(o?.z||100)/100;
  return `<div class="ph${selImg&&selImg.p===pid&&selImg.k===key?" sel":""}" data-p="${pid}" data-i="${key}">${has?`<img alt="" src="${o.src}" style="object-position:${o.x}% ${o.y}%;transform:scale(${z});transform-origin:${o.x}% ${o.y}%">`:`<div class="empty">${label||"Ajouter une photo"}</div>`}</div>`}
function foot(i,n){return `<footer class="p-foot"><img src="${LOGO}" alt=""><span>Cyril Chauvin Studio</span><span class="mid">${esc(S.title||"")}</span><span class="pn">${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}</span></footer>`}

/* ---------- rendu des pages ---------- */
function pageHTML(p,i,n){const d=p.data,id=p.id;
  switch(p.type){
  case"cover":return `<article class="page t-cover${d.img.src?"":" noimg"}">${ph(id,"img",d.img,"Photo de couverture")}
    <div class="logo"><img src="${LOGO}" alt="">Cyril Chauvin Studio</div>
    <div class="ov">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Client · Lieu")}${ed(id,"title",d.title,"h1","Titre")}${ed(id,"sub",d.sub,"sub","Sous-titre")}
    <div class="meta">${ed(id,"date",d.date,"","Date")}${ed(id,"right",d.right,"","Mention")}</div></div></article>`;
  case"text":return `<article class="page t-text"><div class="p-body"><div class="hd" style="display:flex;flex-direction:column;gap:4mm">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique")}${ed(id,"title",d.title,"h1","Titre")}<div class="rule"></div></div>${ed(id,"body",d.body,"body","Texte…",1)}</div>${foot(i,n)}</article>`;
  case"full":return `<article class="page t-full"><div class="p-body">${ph(id,"img",d.img)}${ed(id,"cap",d.cap,"cap","Légende")}</div>${foot(i,n)}</article>`;
  case"split":return `<article class="page t-split${d.rev?" rev":""}"><div class="p-body">${ph(id,"img",d.img)}<div class="tx">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique")}${ed(id,"title",d.title,"h2","Titre")}${ed(id,"body",d.body,"body","Texte…",1)}</div></div>${foot(i,n)}</article>`;
  case"g2":return `<article class="page t-g2"><div class="p-body"><div class="grid">${["a","b"].map(k=>`<div class="cell">${ph(id,k,d[k])}${ed(id,"c"+k,d["c"+k],"cap","Légende (facultatif)")}</div>`).join("")}</div></div>${foot(i,n)}</article>`;
  case"g4":return `<article class="page t-g4"><div class="p-body"><div class="grid">${["a","b","c","d"].map(k=>`<div class="cell">${ph(id,k,d[k])}${ed(id,"c"+k,d["c"+k],"cap","Légende (facultatif)")}</div>`).join("")}</div></div>${foot(i,n)}</article>`;
  case"fig":return `<article class="page t-fig"><div class="p-body"><div style="display:flex;flex-direction:column;gap:4mm">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique")}${ed(id,"title",d.title,"h1","Titre")}</div><div class="figs">${[1,2,3].map(k=>`<div class="fig">${ed(id,"n"+k,d["n"+k],"n","00")}${ed(id,"l"+k,d["l"+k],"l","Libellé")}</div>`).join("")}</div></div>${foot(i,n)}</article>`;
  case"quote":return `<article class="page t-quote"><div class="p-body"><div class="mark">“</div>${ed(id,"q",d.q,"q","Citation")}<div><div class="rule" style="margin-bottom:4mm"></div>${ed(id,"who",d.who,"who","Nom")}${ed(id,"role",d.role,"role","Fonction")}</div></div>${foot(i,n)}</article>`;
  case"contact":{const s=S.set;return `<article class="page t-contact"><div class="p-body"><div class="big"><img src="${LOGO}" alt=""><div><b>Cyril Chauvin Studio</b><div class="baseline">${esc(s.base)}</div></div></div>${ed(id,"title",d.title,"h1","Titre")}
    <div class="lines"><div class="ln"><small>Adresse</small>${esc(s.addr)}</div><div class="ln"><small>Mobile</small>${esc(s.tel)}</div><div class="ln"><small>Site</small>${esc(s.web)}</div><div class="ln"><small>E-mail</small>${esc(s.mail)}</div></div></div>${foot(i,n)}</article>`}
  }}

function render(){
  const L=S.orient==="landscape", pw=(L?297:210), ph_=(L?210:297), m=L?14:16;
  document.documentElement.style.setProperty("--pw",pw+"mm");
  document.documentElement.style.setProperty("--ph",ph_+"mm");
  document.documentElement.style.setProperty("--m",m+"mm");
  document.body.classList.toggle("landscape",L);
  $("#pagesize").textContent=`@page{size:A4 ${L?"landscape":"portrait"};margin:0}`;
  $("#oriTag").textContent=L?"A4 paysage · 297 × 210 mm":"A4 portrait · 210 × 297 mm";
  $("#docTitle").value=S.title||"";
  document.title=(S.title?S.title+" · ":"")+"Mise en page CCS";
  const n=S.pages.length;
  $("#desk").innerHTML=S.pages.map((p,i)=>`<section class="sheet-wrap" data-id="${p.id}">
    <div class="sheet-tools"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${TYPES[p.type].name}</span><span class="sp"></span>
      ${p.type==="split"?`<button class="chip" data-a="flip" type="button">Inverser</button>`:""}
      <button class="chip" data-a="up" type="button" ${i===0?"disabled":""} aria-label="Monter">↑</button>
      <button class="chip" data-a="down" type="button" ${i===n-1?"disabled":""} aria-label="Descendre">↓</button>
      <button class="chip" data-a="dup" type="button">Dupliquer</button>
      <button class="chip" data-a="del" type="button">Supprimer</button></div>
    <div class="zoomer">${pageHTML(p,i,n)}</div></section>`).join("")||`<p style="color:var(--mute)">Aucune page. Ajoutez-en une avec « + Page ».</p>`;
  fit();
}
function fit(){
  const L=S&&S.orient==="landscape";const pw=(L?297:210)*MM, ph_=(L?210:297)*MM;
  const avail=Math.min(window.innerWidth-32,1100);const z=Math.min(1,avail/pw);
  document.querySelectorAll(".zoomer").forEach(w=>{w.style.setProperty("--zw",pw*z+"px");w.style.setProperty("--zh",ph_*z+"px");w.firstElementChild.style.transform=`scale(${z})`});
  document.querySelectorAll(".sheet-wrap").forEach(w=>w.style.width=pw*z+"px");
}
window.addEventListener("resize",fit);
window.addEventListener("beforeprint",()=>document.querySelectorAll(".page").forEach(p=>p.style.transform="none"));
window.addEventListener("afterprint",fit);

/* ---------- édition texte ---------- */
const P=id=>S.pages.find(p=>p.id===id);
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.k||!t.dataset.p)return;const p=P(t.dataset.p);if(!p)return;
  p.data[t.dataset.k]=t.dataset.rich?t.innerHTML:t.innerText.replace(/\n+$/,"");save()});
document.addEventListener("paste",e=>{const t=e.target.closest&&e.target.closest("[contenteditable]");if(!t)return;e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData("text/plain");
  if(t.dataset.rich){const html=txt.split(/\n{2,}/).map(par=>"<p>"+esc(par).replace(/\n/g,"<br>")+"</p>").join("");document.execCommand("insertHTML",false,html)}
  else document.execCommand("insertText",false,txt.replace(/\s*\n\s*/g," "))});
document.addEventListener("keydown",e=>{const t=e.target;if(t.isContentEditable&&!t.dataset.rich&&e.key==="Enter"&&!/^(sub|q|title|l\d)$/.test(t.dataset.k)){e.preventDefault();t.blur()}
  if(e.key==="Escape")closeInsp()});

/* ---------- photos ---------- */
let pending=null;
$("#desk").addEventListener("click",e=>{
  const tool=e.target.closest("[data-a]");if(tool)return pageTool(tool);
  if(e.target.closest("[contenteditable]"))return;
  const box=e.target.closest(".ph");if(!box)return;
  const o=P(box.dataset.p).data[box.dataset.i];
  if(!o.src){pending={p:box.dataset.p,k:box.dataset.i};$("#fileImg").value="";$("#fileImg").click();return}
  selImg={p:box.dataset.p,k:box.dataset.i};openInsp();
});
$("#fileImg").addEventListener("change",async e=>{const f=e.target.files[0];if(!f||!pending)return;
  try{const src=await shrink(f);const o=P(pending.p).data[pending.k];Object.assign(o,{src,x:50,y:50,z:100});selImg=pending;render();openInsp();save()}catch(err){toast("Image illisible. Essayez un JPEG ou un PNG.")}
  pending=null});
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=3000;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",.9))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function curImg(){return selImg&&P(selImg.p)?P(selImg.p).data[selImg.k]:null}
function openInsp(){const o=curImg();if(!o)return;$("#iX").value=o.x;$("#iY").value=o.y;$("#iZ").value=o.z;$("#insp").hidden=false;markSel()}
function closeInsp(){selImg=null;$("#insp").hidden=true;markSel()}
function markSel(){document.querySelectorAll(".ph").forEach(b=>b.classList.toggle("sel",!!selImg&&b.dataset.p===selImg.p&&b.dataset.i===selImg.k))}
function applyImg(){const o=curImg();if(!o)return;o.x=+$("#iX").value;o.y=+$("#iY").value;o.z=+$("#iZ").value;
  const b=document.querySelector(`.ph[data-p="${selImg.p}"][data-i="${selImg.k}"] img`);if(b){b.style.objectPosition=`${o.x}% ${o.y}%`;b.style.transformOrigin=`${o.x}% ${o.y}%`;b.style.transform=`scale(${o.z/100})`}save()}
["#iX","#iY","#iZ"].forEach(s=>$(s).addEventListener("input",applyImg));
$("#iRep").onclick=()=>{pending={...selImg};$("#fileImg").value="";$("#fileImg").click()};
$("#iDel").onclick=()=>{const o=curImg();if(o){Object.assign(o,img())}closeInsp();render();save()};
$("#iClose").onclick=closeInsp;

/* ---------- pages ---------- */
function pageTool(b){const id=b.closest(".sheet-wrap").dataset.id;const i=S.pages.findIndex(p=>p.id===id);const a=b.dataset.a;
  if(a==="up"&&i>0)[S.pages[i-1],S.pages[i]]=[S.pages[i],S.pages[i-1]];
  if(a==="down"&&i<S.pages.length-1)[S.pages[i+1],S.pages[i]]=[S.pages[i],S.pages[i+1]];
  if(a==="dup"){const c=JSON.parse(JSON.stringify(S.pages[i]));c.id=uid();S.pages.splice(i+1,0,c)}
  if(a==="del"){if(b.dataset.armed){S.pages.splice(i,1);closeInsp()}else{b.dataset.armed=1;b.textContent="Confirmer ?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Supprimer"}},2500);return}}
  if(a==="flip")S.pages[i].data.rev=!S.pages[i].data.rev;
  render();save()}
$("#addPop").innerHTML=Object.entries(TYPES).map(([k,t])=>`<button type="button" data-t="${k}">${t.name} <small>${t.hint}</small></button>`).join("");
$("#addPop").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const t=b.dataset.t;
  const idx=S.pages.length&&S.pages[S.pages.length-1].type==="contact"&&t!=="contact"?S.pages.length-1:S.pages.length;
  S.pages.splice(idx,0,{id:uid(),type:t,data:TYPES[t].make()});$("#addPop").hidden=true;render();save();
  const w=document.querySelectorAll(".sheet-wrap")[idx];w&&w.scrollIntoView({behavior:"smooth",block:"start"})};
function pop(btn,p){btn.onclick=e=>{e.stopPropagation();const h=p.hidden;document.querySelectorAll(".menu-pop").forEach(x=>x.hidden=true);p.hidden=!h}}
pop($("#addBtn"),$("#addPop"));pop($("#fileBtn"),$("#filePop"));
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))document.querySelectorAll(".menu-pop").forEach(x=>x.hidden=true)});

$("#docTitle").addEventListener("input",e=>{S.title=e.target.value;document.querySelectorAll(".p-foot .mid").forEach(m=>m.textContent=S.title);save()});
$("#oriBtn").onclick=()=>{S.orient=S.orient==="landscape"?"portrait":"landscape";render();save();toast(S.orient==="landscape"?"Passé en horizontal":"Passé en vertical")};
$("#pdfBtn").onclick=()=>{closeInsp();document.activeElement&&document.activeElement.blur();
  toast("Dans la fenêtre d'impression : « Enregistrer en PDF », marges : aucune");setTimeout(()=>window.print(),350)};

/* coordonnées */
$("#setBtn").onclick=()=>{const s=S.set;$("#sAddr").value=s.addr;$("#sTel").value=s.tel;$("#sWeb").value=s.web;$("#sMail").value=s.mail;$("#sBase").value=s.base;$("#settings").hidden=false};
$("#sCancel").onclick=()=>$("#settings").hidden=true;
$("#setForm").onsubmit=e=>{e.preventDefault();S.set={addr:$("#sAddr").value,tel:$("#sTel").value,web:$("#sWeb").value,mail:$("#sMail").value,base:$("#sBase").value};$("#settings").hidden=true;render();save();toast("Coordonnées mises à jour")};

/* fichiers projet */
function slug(s){return (s||"mise-en-page").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
$("#fSave").onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=slug(S.title)+".ccs.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$("#filePop").hidden=true;toast("Projet enregistré")};
const openProj=()=>{$("#fileProj").value="";$("#fileProj").click()};
$("#fOpen").onclick=openProj;$("#startOpen").onclick=openProj;
$("#fileProj").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pages)throw 0;d.set={...DEF_SET,...(d.set||{})};S=d;$("#start").hidden=true;render();save();toast("Projet ouvert")}catch(err){toast("Ce fichier n'est pas un projet de mise en page.")}};r.readAsText(f)};
$("#fNew").onclick=()=>{$("#filePop").hidden=true;showStart()};

/* ---------- départ ---------- */
let startOri="portrait";
$("#oriP").onclick=()=>{startOri="portrait";$("#oriP").setAttribute("aria-pressed","true");$("#oriL").setAttribute("aria-pressed","false")};
$("#oriL").onclick=()=>{startOri="landscape";$("#oriL").setAttribute("aria-pressed","true");$("#oriP").setAttribute("aria-pressed","false")};
function begin(blank){const title=$("#startTitle").value.trim()||"Sans titre";
  const types=blank?["cover"]:["cover","text","split","g2","fig","quote","contact"];
  S={v:1,orient:startOri,title,set:{...(S&&S.set||DEF_SET)},pages:types.map(t=>({id:uid(),type:t,data:TYPES[t].make()}))};
  S.pages[0].data.title=title==="Sans titre"?"Titre du projet":title;
  selImg=null;$("#start").hidden=true;render();save();window.scrollTo(0,0)}
$("#startGo").onclick=()=>begin(false);$("#startBlank").onclick=()=>begin(true);
$("#startTitle").addEventListener("keydown",e=>{if(e.key==="Enter")begin(false)});
let saved=null;
function showStart(){$("#start").hidden=false;$("#startTitle").value="";
  if(saved||S){const s=S||saved;$("#resume").hidden=false;$("#resumeTxt").textContent=`En cours : « ${s.title} » · ${s.pages.length} page${s.pages.length>1?"s":""} · ${s.orient==="landscape"?"horizontal":"vertical"}`}
  setTimeout(()=>$("#startTitle").focus(),50)}
$("#resumeGo").onclick=()=>{if(!S)S=saved;$("#start").hidden=true;render()};

(async()=>{await DB.open();saved=await DB.get();if(saved)saved.set={...DEF_SET,...(saved.set||{})};showStart()})();
</script>
</body>
</html>
