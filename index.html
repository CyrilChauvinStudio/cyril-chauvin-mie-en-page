<style>
/* Table lumineuse + feuilles A4 blanches, panneau Claude à droite. Tout en Work Sans. */
:root{
  --table:#e8e7e4; --chrome:#f6f5f3; --ink:#111; --mute:#6d6b67; --line:#d3d1cc; --accent:#111; --hi:#2b5cff; --warn:#c2410c; --bubble:#ffffff;
  --f:"Work Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --barh:56px; --chatw:400px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--table:#1b1b1a;--chrome:#242423;--ink:#efeeea;--mute:#9b9993;--line:#3a3937;--accent:#efeeea;--warn:#fb923c;--bubble:#2e2e2c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:var(--f);font-size:13px}
[hidden]{display:none!important}

/* barre */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand img{width:28px;height:28px}
.brand b{font-weight:600;letter-spacing:.14em;font-size:11px;text-transform:uppercase;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--mute)}
#docTitle{flex:1 1 160px;min-width:0;border:1px solid transparent;background:transparent;color:var(--ink);padding:7px 9px;border-radius:6px;font-size:14px;font-weight:500}
#docTitle:hover,#docTitle:focus{border-color:var(--line);outline:none;background:var(--table)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--accent);color:var(--chrome);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.tag{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.15);display:grid;gap:2px;z-index:60;max-height:70vh;overflow:auto}
.menu-pop button{display:flex;justify-content:space-between;gap:12px;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:5px;cursor:pointer}
.menu-pop button:hover{background:var(--table)}
.menu-pop small{color:var(--mute)}

/* plan de travail */
#desk{padding:24px 16px 120px;display:flex;flex-direction:column;align-items:center;gap:30px}
@media (min-width:1000px){#desk{margin-right:var(--chatw)}}
.sheet-wrap{display:flex;flex-direction:column;gap:8px;max-width:100%}
.sheet-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.sheet-tools .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sheet-tools .sp{flex:1}
.sheet-tools .over{color:var(--warn);font-weight:500}
.chip{border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:5px;padding:4px 8px;cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:default}
.zoomer{width:var(--zw);height:var(--zh)}
.page{transform-origin:0 0;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.12)}
.sheet-wrap.flash .page{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 2mm rgba(43,92,255,.45)}100%{box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.12)}}

/* feuille (papier blanc dans les deux thèmes) */
.page{position:relative;width:var(--pw);height:var(--ph);background:#fff;color:#111;overflow:hidden;font-family:var(--f);display:flex;flex-direction:column;padding:var(--m) var(--m) 0}
.p-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:6mm;overflow:hidden}
.p-foot{height:14mm;flex:none;display:flex;align-items:center;gap:3mm;border-top:.25mm solid #111;margin-top:6mm;font-size:7pt;letter-spacing:.18em;text-transform:uppercase;color:#111}
.p-foot img{width:5mm;height:5mm}
.p-foot .pn{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.1em}
.p-foot .mid{color:#777;letter-spacing:.12em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.eyebrow{font-size:7.5pt;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#777}
.h1{font-size:28pt;font-weight:300;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.h2{font-size:20pt;font-weight:300;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.body{font-size:10pt;line-height:1.55;color:#222}
.body p{margin:0 0 3mm}
.cap{font-size:7.5pt;color:#666;line-height:1.4}
.ml{white-space:pre-line}
.rule{height:.25mm;background:#111;width:14mm;flex:none}
.hd{display:flex;flex-direction:column;gap:4mm}
[contenteditable]{outline:none;border-radius:1mm;transition:box-shadow .15s}
[contenteditable]:hover{box-shadow:0 0 0 .4mm rgba(43,92,255,.25)}
[contenteditable]:focus{box-shadow:0 0 0 .5mm var(--hi)}
[contenteditable]:empty::before{content:attr(data-ph);color:#bbb}

.ph{position:relative;overflow:hidden;background:#f0efed;min-height:0;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phz{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;container-type:size}
.phz>.ph{width:100%;height:100%}
.phz>.ph.rat{width:min(100cqw,calc(100cqh * var(--r)));height:auto;aspect-ratio:var(--r)}
.phz.below{flex:1;min-height:28mm;margin-top:2mm;align-items:flex-start}
.ph .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;color:#8a8883;font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:5mm}
.ph .empty::before{content:"";width:9mm;height:9mm;border:.3mm solid #b5b3ae;border-radius:50%;background:linear-gradient(#b5b3ae,#b5b3ae) center/4mm .3mm no-repeat,linear-gradient(#b5b3ae,#b5b3ae) center/.3mm 4mm no-repeat}
.ph .empty em{text-transform:none;letter-spacing:0;font-size:8.5pt;color:#6d6b67;max-width:110mm;line-height:1.4}
.ph.sel{outline:.7mm solid var(--hi);outline-offset:-.7mm}
.ph.drop{outline:1.2mm solid var(--hi)!important;outline-offset:-1.2mm}
.ph.drop::after{content:"Déposer ici";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,92,255,.18);color:#fff;font-size:11pt;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.page.drop{outline:1mm dashed var(--hi);outline-offset:-1mm}
#dropHint{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;pointer-events:none;background:var(--ink);color:var(--chrome);padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.45;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
@media (min-width:1000px){#dropHint{right:calc(var(--chatw) + 16px)}}
.ph:hover:not(.sel){outline:.4mm solid rgba(43,92,255,.4);outline-offset:-.4mm}

/* couverture */
.t-cover{padding:0}
.t-cover .ph{position:absolute;inset:0}
.t-cover .ov{position:absolute;inset:auto 0 0 0;padding:var(--m);padding-top:40mm;background:var(--shade) bottom/100% 100% no-repeat;color:#fff;display:flex;flex-direction:column;gap:3mm;pointer-events:none}
.t-cover .ov [contenteditable]{pointer-events:auto}
.t-cover .ov .eyebrow{color:#e4e4e4}
.t-cover .ov .h1{font-size:38pt;font-weight:200}
.t-cover .ov .sub{font-size:12pt;font-weight:300;max-width:150mm}
.t-cover .ov .meta{display:flex;justify-content:space-between;align-items:end;gap:6mm;margin-top:4mm;padding-top:3mm;border-top:.25mm solid #d6d6d6;font-size:7.5pt;letter-spacing:.2em;text-transform:uppercase}
.t-cover .logo{position:absolute;top:var(--m);left:var(--m);display:flex;align-items:center;gap:3mm;color:#fff;font-size:7.5pt;letter-spacing:.24em;text-transform:uppercase;font-weight:500;pointer-events:none}
.t-cover .logo img{width:11mm;height:11mm;box-shadow:0 0 0 .4mm #fff;border-radius:50%}
.t-cover .kind{position:absolute;top:var(--m);right:var(--m);color:#fff;font-size:7.5pt;letter-spacing:.24em;text-transform:uppercase;pointer-events:none}
.t-cover.noimg .ov{background:none!important;color:#111}
.t-cover.noimg .ov .eyebrow{color:#777}
.t-cover.noimg .ov .meta{border-color:#111}
.t-cover.noimg .logo,.t-cover.noimg .kind{color:#111}

/* intercalaire */
.t-section .p-body{justify-content:flex-end;padding-bottom:10mm;gap:5mm}
.t-section .big{font-size:90pt;font-weight:200;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.t-section .sub{font-size:11pt;font-weight:300;color:#555;max-width:130mm}

/* texte */
.t-text .p-body{gap:5mm;padding-top:4mm}
.landscape .t-text .body{columns:2;column-gap:10mm}
.landscape .t-text .p-body{display:grid;grid-template-columns:85mm 1fr;grid-template-rows:auto 1fr;column-gap:12mm;align-content:start}
.landscape .t-text .hd{grid-row:1/3}
.landscape .t-text.hasb .p-body{grid-template-rows:auto 1fr;row-gap:7mm}
.landscape .t-text.hasb .hd{grid-row:auto}
.landscape .t-text .below{grid-column:1/3}

.t-full .phz{flex:1}

/* photo + texte */
.t-split .p-body{display:grid;grid-template-rows:1.1fr auto;gap:7mm}
.t-split .tx{display:flex;flex-direction:column;gap:4mm;min-height:0}
.landscape .t-split .p-body{grid-template-rows:none;grid-template-columns:1.2fr 1fr;gap:10mm}
.landscape .t-split .tx{justify-content:flex-end;padding-bottom:2mm}
.t-split.rev .phz{order:2}
.landscape .t-split.rev .p-body{grid-template-columns:1fr 1.2fr}

/* grilles */
.t-g2 .grid,.t-g4 .grid{flex:1;display:grid;min-height:0}
.t-g2 .grid{gap:5mm;grid-template-rows:1fr 1fr}
.landscape .t-g2 .grid{grid-template-rows:none;grid-template-columns:1fr 1fr}
.t-g4 .grid{gap:4mm;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.cell{display:flex;flex-direction:column;gap:2mm;min-height:0}
.cell .phz{flex:1}

/* chiffres */
.t-fig .p-body{justify-content:center;gap:12mm}
.t-fig .figs{display:grid;gap:9mm}
.landscape .t-fig .figs{grid-template-columns:repeat(3,1fr);gap:10mm}
.t-fig .fig{border-top:.25mm solid #111;padding-top:4mm;display:flex;flex-direction:column;gap:2mm}
.t-fig .n{font-size:44pt;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.t-fig .l{font-size:9.5pt;line-height:1.45;color:#333;max-width:80mm}

/* citation */
.t-quote .p-body{justify-content:center;gap:8mm;padding:0 6mm}
.t-quote .q{font-size:24pt;font-weight:300;font-style:italic;line-height:1.25;text-wrap:balance}
.landscape .t-quote .q{font-size:28pt;max-width:220mm}
.t-quote .mark{font-size:60pt;font-weight:200;line-height:.6;height:12mm}
.t-quote .who{font-size:8pt;letter-spacing:.2em;text-transform:uppercase}
.t-quote .role{font-size:9pt;color:#666}

/* liste */
.t-list .p-body{gap:7mm;padding-top:4mm}
.t-list .items{display:grid;gap:0;counter-reset:it}
.landscape .t-list .items{grid-template-columns:1fr 1fr;column-gap:12mm}
.t-list .it{display:grid;grid-template-columns:10mm 1fr;gap:1.5mm 3mm;border-top:.25mm solid #111;padding:3.5mm 0 4.5mm}
.t-list .it::before{counter-increment:it;content:counter(it,decimal-leading-zero);font-size:8pt;letter-spacing:.1em;color:#777;padding-top:1mm;grid-row:1/3}
.t-list .it .t{font-size:12pt;font-weight:500;line-height:1.25}
.t-list .it .d{font-size:9.5pt;line-height:1.5;color:#333}

/* tableau & script */
.tbx{min-height:0}
.tb{width:100%;border-collapse:collapse;font-size:8.8pt;line-height:1.45}
.tb th{text-align:left;font-size:7pt;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#777;padding:0 3mm 2mm 0;border-bottom:.25mm solid #111;vertical-align:bottom}
.tb td{padding:2.5mm 3mm 2.5mm 0;border-bottom:.15mm solid #cfcdc8;vertical-align:top;color:#222}
.tb td.r,.tb th.r{text-align:right;padding-right:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tr.tot td{font-weight:600;border-bottom:.25mm solid #111;color:#111}
.tnote{font-size:8pt;color:#666;line-height:1.45}
.t-script .tb td{white-space:pre-line}
.t-script .tb td:first-child{width:16mm;font-variant-numeric:tabular-nums;color:#777;font-size:8pt}
.t-script .tb td:nth-child(2){width:52%}
.t-script .tb th:first-child{width:16mm}

/* contact */
.t-contact .p-body{justify-content:space-between;padding:10mm 0 4mm}
.t-contact .big{display:flex;align-items:center;gap:6mm}
.t-contact .big img{width:24mm;height:24mm}
.t-contact .big b{font-size:11pt;font-weight:500;letter-spacing:.28em;text-transform:uppercase}
.t-contact .lines{display:grid;gap:5mm}
.landscape .t-contact .lines{grid-template-columns:repeat(4,auto);justify-content:space-between}
.t-contact .ln{border-top:.25mm solid #111;padding-top:3mm;display:flex;flex-direction:column;gap:1.5mm;font-size:11pt;font-weight:300}
.t-contact .ln small{font-size:7pt;letter-spacing:.24em;text-transform:uppercase;color:#777;font-weight:500}
.t-contact .baseline{font-size:9pt;color:#666}

/* ---------- panneau Claude ---------- */
#chat{position:fixed;z-index:40;right:0;top:var(--barh);bottom:0;width:var(--chatw);background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.ch-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch-h b{font-weight:600;font-size:13px}
.ch-h .tag{margin-right:auto}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13.5px;line-height:1.5;padding:9px 12px;border-radius:10px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--chrome);border-bottom-right-radius:3px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--bubble);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.a ul{margin:4px 0;padding-left:18px}
.msg.a p{margin:0 0 6px}.msg.a p:last-child{margin:0}
.msg .did{display:block;margin-top:6px;font-size:11.5px;color:var(--mute)}
.msg.err{border-color:var(--warn);color:var(--warn)}
.typing{align-self:flex-start;font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
#comp{padding:10px 14px 14px;display:grid;gap:8px}
#inp{width:100%;resize:none;min-height:64px;max-height:200px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--table);color:var(--ink);font-size:14px;line-height:1.45}
#inp:focus{outline:none;border-color:var(--ink)}
#comp .row{display:flex;gap:8px;align-items:center}
#comp .sp{flex:1}
#att{display:flex;gap:6px;flex-wrap:wrap}
#att span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;display:inline-flex;gap:6px;align-items:center}
#att button{border:0;background:none;color:var(--mute);cursor:pointer;padding:0}
.keybox{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;font-size:13px;line-height:1.5;background:var(--bubble)}
.keybox input{padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--table);color:var(--ink);width:100%}
.keybox small{color:var(--mute)}
#chatFab{display:none}
@media (max-width:999px){
  #chat{top:auto;left:0;width:auto;height:min(78vh,640px);border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .25s}
  body.chat-on #chat{transform:none}
  .quick{flex-wrap:nowrap;overflow-x:auto}.quick .chip{white-space:nowrap}
  #chatFab{display:inline-flex;position:fixed;z-index:39;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 8px 20px rgba(0,0,0,.25)}
}
@media (min-width:1000px){#chClose{display:none}}

/* inspecteur photo */
#insp{position:fixed;z-index:70;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:12px 14px;display:grid;gap:10px}
#insp .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#insp label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex:1 1 130px}
#insp input[type=range]{flex:1;min-width:0;accent-color:var(--ink)}
#insp select,#insp input[type=number]{padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--table);color:var(--ink);font-size:13px}
#insp select{flex:1;min-width:0}
#insp input[type=number]{width:64px}
#insp .ttl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-right:auto}

/* départ */
#start{position:fixed;inset:0;z-index:100;background:var(--table);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
.st{width:min(720px,100%);display:grid;gap:18px;margin:auto 0}
.st header{display:flex;align-items:center;gap:14px}
.st header img{width:44px;height:44px}
.st h1{margin:0;font-weight:300;font-size:28px;letter-spacing:-.01em}
.st p{margin:0;color:var(--mute);line-height:1.5}
.st .q{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:10px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--ink)}
.card[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card b{font-weight:500;font-size:14px}
.card small{color:var(--mute);font-size:12px;line-height:1.4}
.orients{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orients .card{align-items:center;text-align:center}
.pg{background:#fff;border:1px solid #cfcdc8;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.pg::after{content:"";position:absolute;left:12%;right:12%;bottom:10%;height:1px;background:#111}
.pg i{position:absolute;left:12%;right:12%;top:12%;bottom:30%;background:#e4e3e0}
.st input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:8px;font-size:15px}
.st .go{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.resume{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.resume span{color:var(--mute);font-size:13px;flex:1}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:8px 14px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#settings{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#settings .box{background:var(--chrome);color:var(--ink);border-radius:12px;padding:20px;width:min(480px,100%);display:grid;gap:11px;max-height:90vh;overflow:auto}
#settings h2{margin:0;font-weight:400;font-size:18px}
#settings h3{margin:8px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}
#settings label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
#settings input,#settings select{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--table);color:var(--ink);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* impression / PDF */
@media print{
  html,body{background:#fff;height:auto}
  .bar,.sheet-tools,#insp,#start,#toast,#settings,#chat,#chatFab{display:none!important}
  #desk{padding:0;gap:0;display:block;margin:0!important}
  .sheet-wrap{display:block;width:auto!important}
  .zoomer{width:auto!important;height:auto!important}
  .page{transform:none!important;box-shadow:none!important;animation:none!important;break-after:page;page-break-after:always}
  .sheet-wrap:last-child .page{break-after:auto;page-break-after:auto}
  .ph .empty{display:none}
  .ph{background:transparent}
  .ph,.ph.sel,.ph:hover,.ph.drop,.page.drop{outline:none!important}
  .ph.drop::after,#dropHint{display:none!important}
  [contenteditable]{box-shadow:none!important}
  [contenteditable]:empty::before{content:""}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pagesize">@page{size:A4 portrait;margin:0}</style>

<body>

 proposition:{name:"Proposition",desc:"Offre commerciale : contexte, intention, dispositif, budget.",
  hello:"On construit la proposition. Raconte-moi le projet comme tu le ferais au téléphone : le client, l'événement ou le sujet, la date, le lieu, ce qu'ils attendent, le budget s'il y en a un. Tu peux aussi coller le brief ou joindre le PDF.",
  guide:"Proposition commerciale pour un film et/ou un reportage photo. Structure conseillée : couverture ; contexte (le client, la demande, l'enjeu) ; notre lecture / intention (ce qu'on veut faire ressentir, l'angle) ; dispositif (équipe, jours, matériel, formats livrés) en liste ; déroulé et livrables (tableau) ; planning si utile ; budget (tableau : Poste | Détail | Montant HT, ligne Total) ; conditions éventuelles ; contact. Ton : sûr, clair, concret. On vend une vision et une méthode.",
  pages:()=>[P_("cover",{eyebrow:"Proposition · [Client]"}),P_("text",{eyebrow:"Contexte",title:"La demande",body:"<p>[À rédiger avec Claude : le client, son actualité, ce qu'il attend.]</p>"}),P_("split",{eyebrow:"Intention",title:"Notre lecture du projet",body:"<p>[Angle, émotion recherchée, ce que le film ou les photos doivent produire.]</p>",img:img("Photo d'ambiance qui donne le ton")}),P_("list",{eyebrow:"Dispositif",title:"Ce que nous mettons en place"}),P_("table",{eyebrow:"Livrables",title:"Ce que vous recevez",cols:["Livrable","Format","Délai"],rows:[["","",""],["","",""]]}),P_("table",{eyebrow:"Budget",title:"Investissement",cols:["Poste","Détail","Montant HT"],rows:[["","",""],["","",""],["Total","",""]],note:"Devis valable 30 jours. Frais de déplacement hors Bouches-du-Rhône en sus."}),P_("contact")]},
 script:{name:"Script",desc:"Le film séquence par séquence : image, son, durée.",
  hello:"On écrit le script. Dis-moi : le film (durée, diffusion, format), ce qu'il doit raconter, qui on filme, et ce que tu as déjà en tête (une image d'ouverture, une phrase, une musique). Je découpe ensuite en séquences.",
  guide:"Script de film. Commence par une page de pitch (texte : durée, format, diffusion, ton, le film en une phrase). Puis le film en pages 'script' : chaque ligne = un moment, avec durée ou timecode (tc), ce qu'on voit (img) et ce qu'on entend (son : ambiance, musique, interview, voix off entre guillemets). Images concrètes et filmables, au présent. Additionne les durées pour qu'elles collent à la durée cible et indique-la.",
  pages:()=>[P_("cover",{eyebrow:"Script · [Client]"}),P_("text",{eyebrow:"Pitch",title:"Le film en une phrase",body:"<p>[Durée · format · diffusion · ton]</p>"}),P_("script",{eyebrow:"Séquence 1",title:"Ouverture"}),P_("contact")]},
 note:{name:"Note de réalisation",desc:"Intention, image, son, montage, références.",

function deepMerge(a,b){for(const k in b){const v=b[k];if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))deepMerge(a[k],v);else a[k]=v}return a}
function getP(o,path){return path.split(".").reduce((x,k)=>x==null?x:x[k],o)}
function setP(o,path,v){const ks=path.split(".");let x=o;for(let i=0;i<ks.length-1;i++){if(x[ks[i]]==null)x[ks[i]]={};x=x[ks[i]]}x[ks[ks.length-1]]=v}
function toRich(s){s=String(s??"");if(/<(p|br|b|strong|em|i)\b/i.test(s))return s;if(!s.trim())return "";
  return s.trim().split(/\n{2,}/).map(par=>"<p>"+esc(par).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")+"</p>").join("")}

function ed(pid,path,val,cls,ph,o={}){return `<div class="${cls||""}${o.ml?" ml":""}" contenteditable="true" spellcheck="true" data-p="${pid}" data-k="${path}"${o.rich?' data-rich="1"':''}${o.one?' data-one="1"':''} data-ph="${esc(ph||"")}">${o.rich?(val||""):esc(val)}</div>`}
function ratioOf(o){if(!o||!o.ratio||o.ratio==="fill")return 0;if(o.ratio==="photo")return o.w&&o.h?o.w/o.h:0;
  const m=String(o.ratio).match(/^\s*(\d+(?:[.,]\d+)?)\s*[:/x×]\s*(\d+(?:[.,]\d+)?)\s*$/);if(!m)return 0;const a=parseFloat(m[1].replace(",",".")),b=parseFloat(m[2].replace(",","."));return a>0&&b>0?a/b:0}
function phBox(pid,key,o,label,zoneCls,noZone){o={...img(),...(o||{})};const z=(o.z||100)/100;const r=ratioOf(o);
  const inner=`<div class="ph${r?" rat":""}${selImg&&selImg.p===pid&&selImg.k===key?" sel":""}" data-p="${pid}" data-i="${key}"${r?` style="--r:${r.toFixed(4)}"`:""}>${o.src?`<img alt="" src="${o.src}" style="object-position:${o.x}% ${o.y}%${z!==1?`;transform:scale(${z});transform-origin:${o.x}% ${o.y}%`:""}">`:`<div class="empty">${label||"Ajouter une photo"}${o.hint?`<em>${esc(o.hint)}</em>`:""}</div>`}</div>`;
  return noZone?inner:`<div class="phz${zoneCls?" "+zoneCls:""}">${inner}</div>`}
const BELOW=["text","list","table"];

function foot(i,n){return `<footer class="p-foot"><img src="${LOGO}" alt=""><span>Cyril&nbsp;Chauvin&nbsp;Studio</span><span class="mid">${esc(S.title||"")}</span><span class="pn">${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}</span></footer>`}
const ONE={one:1};
function pageHTML(p,i,n){const d=p.data,id=p.id;
  switch(p.type){

    <div class="ov">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Client · Lieu",ONE)}${ed(id,"title",d.title,"h1","Titre")}${ed(id,"sub",d.sub,"sub","Sous-titre (facultatif)")}
    <div class="meta">${ed(id,"date",d.date,"","Date",ONE)}${ed(id,"right",d.right,"","Mention",ONE)}</div></div></article>`;
  case"section":return `<article class="page t-section"><div class="p-body">${ed(id,"n",d.n,"big","01",ONE)}<div class="rule"></div>${ed(id,"title",d.title,"h1","Titre de partie")}${ed(id,"sub",d.sub,"sub","Sous-titre (facultatif)")}</div>${foot(i,n)}</article>`;
  case"text":return `<article class="page t-text${d.below?" hasb":""}"><div class="p-body"><div class="hd">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique",ONE)}${ed(id,"title",d.title,"h1","Titre")}<div class="rule"></div></div>${ed(id,"body",d.body,"body","Texte…",{rich:1})}${belowBox(id,d)}</div>${foot(i,n)}</article>`;

  case"split":return `<article class="page t-split${d.rev?" rev":""}"><div class="p-body">${phBox(id,"img",d.img)}<div class="tx">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique",ONE)}${ed(id,"title",d.title,"h2","Titre")}${ed(id,"body",d.body,"body","Texte…",{rich:1})}</div></div>${foot(i,n)}</article>`;
  case"g2":return `<article class="page t-g2"><div class="p-body"><div class="grid">${["a","b"].map(k=>`<div class="cell">${phBox(id,k,d[k])}${ed(id,"c"+k,d["c"+k],"cap","Légende (facultatif)")}</div>`).join("")}</div></div>${foot(i,n)}</article>`;
  case"g4":return `<article class="page t-g4"><div class="p-body"><div class="grid">${["a","b","c","d"].map(k=>`<div class="cell">${phBox(id,k,d[k])}${ed(id,"c"+k,d["c"+k],"cap","Légende (facultatif)")}</div>`).join("")}</div></div>${foot(i,n)}</article>`;
  case"list":return `<article class="page t-list"><div class="p-body"><div class="hd">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique",ONE)}${ed(id,"title",d.title,"h1","Titre")}</div><div class="items">${(d.items||[]).map((it,j)=>`<div class="it">${ed(id,`items.${j}.t`,it.t,"t","Point",ONE)}${ed(id,`items.${j}.d`,it.d,"d","Précision",{ml:1})}</div>`).join("")}</div>${belowBox(id,d)}</div>${foot(i,n)}</article>`;
  case"table":{const cols=d.cols||[],rows=d.rows||[];const numCol=cols.map((_,j)=>rows.some(r=>isNum(r[j])));

  case"script":return `<article class="page t-script"><div class="p-body"><div class="hd">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Séquence",ONE)}${ed(id,"title",d.title,"h2","Titre de séquence")}</div><div class="tbx"><table class="tb"><thead><tr><th>Durée</th><th>Image</th><th>Son · voix</th></tr></thead><tbody>${(d.rows||[]).map((r,ri)=>`<tr><td>${ed(id,`rows.${ri}.tc`,r.tc,"","0:00",ONE)}</td><td>${ed(id,`rows.${ri}.img`,r.img,"ml","Ce qu'on voit")}</td><td>${ed(id,`rows.${ri}.son`,r.son,"ml","Ce qu'on entend")}</td></tr>`).join("")}</tbody></table></div></div>${foot(i,n)}</article>`;
  case"fig":return `<article class="page t-fig"><div class="p-body"><div class="hd">${ed(id,"eyebrow",d.eyebrow,"eyebrow","Rubrique",ONE)}${ed(id,"title",d.title,"h1","Titre")}</div><div class="figs">${[1,2,3].map(k=>`<div class="fig">${ed(id,"n"+k,d["n"+k],"n","00",ONE)}${ed(id,"l"+k,d["l"+k],"l","Libellé")}</div>`).join("")}</div></div>${foot(i,n)}</article>`;
  case"quote":return `<article class="page t-quote"><div class="p-body"><div class="mark">“</div>${ed(id,"q",d.q,"q","Citation")}<div><div class="rule" style="margin-bottom:4mm"></div>${ed(id,"who",d.who,"who","Nom",ONE)}${ed(id,"role",d.role,"role","Fonction",ONE)}</div></div>${foot(i,n)}</article>`;
  case"contact":{const s=S.set;return `<article class="page t-contact"><div class="p-body"><div class="big"><img src="${LOGO}" alt=""><div><b>Cyril Chauvin Studio</b><div class="baseline">${esc(s.base)}</div></div></div>${ed(id,"title",d.title,"h1","Titre")}
    <div class="lines"><div class="ln"><small>Adresse</small>${esc(s.addr)}</div><div class="ln"><small>Mobile</small>${esc(s.tel)}</div><div class="ln"><small>Site</small>${esc(s.web)}</div><div class="ln"><small>E-mail</small>${esc(s.mail)}</div></div></div>${foot(i,n)}</article>`}
  default:return `<article class="page"><div class="p-body">Type de page inconnu</div></article>`}}

function render(flashIds){
  const L=S.orient==="landscape";
  const R=document.documentElement.style;R.setProperty("--pw",(L?297:210)+"mm");R.setProperty("--ph",(L?210:297)+"mm");R.setProperty("--m",(L?14:16)+"mm");

  $("#oriTag").textContent=L?"A4 paysage":"A4 portrait";
  $("#kindTag").textContent=KINDS[S.kind]?.name||"Dossier";$("#chKind").textContent=KINDS[S.kind]?.name||"";
  if(document.activeElement!==$("#docTitle"))$("#docTitle").value=S.title||"";
  document.title=(S.title?S.title+" · ":"")+"Dossiers CCS";
  const n=S.pages.length;
  $("#desk").innerHTML=S.pages.map((p,i)=>`<section class="sheet-wrap${flashIds&&flashIds.has(p.id)?" flash":""}" data-id="${p.id}">
    <div class="sheet-tools"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${TYPES[p.type]?.name||p.type}</span><span class="over" hidden>Le contenu déborde</span><span class="sp"></span>
      ${p.type==="split"?`<button class="chip" data-a="flip" type="button">Inverser</button>`:""}
      ${BELOW.includes(p.type)?(p.data.below?`<button class="chip" data-a="belowDel" type="button">− Photo dessous</button>`:`<button class="chip" data-a="belowAdd" type="button">+ Photo sous le texte</button>`):""}
      ${["list","table","script"].includes(p.type)?`<button class="chip" data-a="rowAdd" type="button">+ Ligne</button><button class="chip" data-a="rowDel" type="button">− Ligne</button>`:""}
      <button class="chip" data-a="up" type="button" ${i===0?"disabled":""} aria-label="Monter">↑</button>
      <button class="chip" data-a="down" type="button" ${i===n-1?"disabled":""} aria-label="Descendre">↓</button>
      <button class="chip" data-a="dup" type="button">Dupliquer</button>
      <button class="chip" data-a="del" type="button">Supprimer</button></div>
    <div class="zoomer">${pageHTML(p,i,n)}</div></section>`).join("")||`<p style="color:var(--mute)">Aucune page. Ajoute-en une avec « + Page » ou demande à Claude.</p>`;
  fit();checkOverflow();
}
function fit(){if(!S)return;
  const bh=$("#bar").offsetHeight;document.documentElement.style.setProperty("--barh",bh+"px");
  const L=S.orient==="landscape";const pw=(L?297:210)*MM,ph=(L?210:297)*MM;
  const avail=Math.min($("#desk").clientWidth-32,1100);const z=Math.max(.2,Math.min(1,avail/pw));
  document.querySelectorAll(".zoomer").forEach(w=>{w.style.setProperty("--zw",pw*z+"px");w.style.setProperty("--zh",ph*z+"px");w.firstElementChild.style.transform=`scale(${z})`});
  document.querySelectorAll(".sheet-wrap").forEach(w=>w.style.width=pw*z+"px")}
function checkOverflow(){const out=[];document.querySelectorAll(".sheet-wrap").forEach(w=>{const b=w.querySelector(".p-body");let o=false;
  if(b){o=b.scrollHeight>b.clientHeight+2;b.querySelectorAll(".tx,.tbx,.items").forEach(x=>{if(x.scrollHeight>x.clientHeight+2)o=true})}
  w.querySelector(".over").hidden=!o;if(o)out.push(w.dataset.id)});return out}
window.addEventListener("resize",fit);
window.addEventListener("beforeprint",()=>document.querySelectorAll(".page").forEach(p=>p.style.transform="none"));
window.addEventListener("afterprint",fit);

/* ---------- édition directe ---------- */
const PG=id=>S.pages.find(p=>p.id===id);
let ovT=null;
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.k||!t.dataset.p)return;const p=PG(t.dataset.p);if(!p)return;
  setP(p.data,t.dataset.k,t.dataset.rich?t.innerHTML:t.innerText.replace(/\n+$/,""));save();clearTimeout(ovT);ovT=setTimeout(checkOverflow,300)});
document.addEventListener("paste",e=>{const t=e.target.closest&&e.target.closest("[contenteditable]");if(!t)return;e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData("text/plain");
  if(t.dataset.rich)document.execCommand("insertHTML",false,toRich(txt));
  else document.execCommand("insertText",false,t.dataset.one?txt.replace(/\s*\n\s*/g," "):txt)});
document.addEventListener("keydown",e=>{const t=e.target;if(t.isContentEditable&&t.dataset.one&&e.key==="Enter"){e.preventDefault();t.blur()}if(e.key==="Escape")closeInsp()});

/* photos */
let pending=null;
$("#desk").addEventListener("click",e=>{const tool=e.target.closest("[data-a]");if(tool)return pageTool(tool);
  if(e.target.closest("[contenteditable]"))return;const box=e.target.closest(".ph");if(!box)return;
  const p=PG(box.dataset.p);if(!p.data[box.dataset.i])p.data[box.dataset.i]=img();const o=p.data[box.dataset.i];
  if(!o.src){pending={p:box.dataset.p,k:box.dataset.i};$("#fileImg").value="";$("#fileImg").click();return}
  selImg={p:box.dataset.p,k:box.dataset.i};openInsp()});
$("#fileImg").addEventListener("change",async e=>{const fs=[...e.target.files];if(!fs.length||!pending)return;const t=pending;pending=null;await placeFiles(fs,t.p,t.k)});

/* ---------- glisser-déposer de photos ---------- */
const SLOTS={cover:["img"],full:["img"],split:["img"],g2:["a","b"],g4:["a","b","c","d"]};
const isImg=f=>f&&(/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif|gif|tiff?)$/i.test(f.name));
async function loadImg(f){try{return await shrinkD(f,3000,.9)}catch(e){toast("Format non lu : "+f.name+" (exporte-la en JPEG)");return null}}
/* pageId+key = case visée ; sinon on remplit les cases vides de la page ; le reste crée de nouvelles pages */
async function placeFiles(files,pageId,key,afterId){
  files=files.filter(isImg);if(!files.length){toast("Glisse des photos (JPEG, PNG, WebP…)");return}
  toast(files.length>1?`Import de ${files.length} photos…`:"Import de la photo…");
  const srcs=(await Promise.all(files.map(loadImg))).filter(Boolean);if(!srcs.length)return;
  const touched=new Set();let last=afterId||null,lastFill=null;
  const put=(p,k,im)=>{const o=p.data[k]||(p.data[k]=img());Object.assign(o,{src:im.src,w:im.w,h:im.h,x:50,y:50,z:100});touched.add(p.id);lastFill={p:p.id,k}};
  if(pageId){const p=PG(pageId);
    if(!key&&BELOW.includes(p.type)&&!p.data.below)p.data.below=img();
    const keys=[...(SLOTS[p.type]||[]),...(p.data.below?["below"]:[])];
    if(key){put(p,key,srcs.shift())}
    for(const k of keys){if(!srcs.length)break;if(!p.data[k]||!p.data[k].src)put(p,k,srcs.shift())}
    last=pageId}
  while(srcs.length){const n=srcs.length;const type=n>=4?"g4":n===3?"g4":n===2?"g2":"full";const pg=P_(type);
    for(const k of SLOTS[type]){if(!srcs.length)break;put(pg,k,srcs.shift())}
    S.pages.splice(insertIndex(last,type),0,pg);touched.add(pg.id);last=pg.id}
  selImg=(pageId&&files.length===1)?lastFill:null;render(touched);save();
  if(selImg)openInsp();else closeInsp();
  const first=S.pages.find(p=>touched.has(p.id));document.querySelector(`.sheet-wrap[data-id="${first.id}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});

let dragDepth=0;

QUI EST CYRIL CHAUVIN STUDIO
Photographe et réalisateur basé à Marseille (4 bd de la Liberté, 13001), en activité depuis 2003 : photos et films pour les marques — entreprises, hôtellerie, institutions, immobilier, événementiel. Site : cyrilchauvinstudio.com. Le dossier est signé Cyril Chauvin Studio. Ne mentionne jamais ANTICORP (marque séparée, hors sujet ici).

LE DOSSIER EN COURS
Type : ${k.name}. ${k.guide}

${CAP()}

COMMENT TU TRAVAILLES
- Tu remplis le dossier AU FUR ET À MESURE avec l'outil edit_dossier : dès qu'une information arrive, écris-la dans la bonne page. Regroupe les modifications d'un même tour dans un seul appel quand c'est possible.
- L'état ci-dessous est la vérité : Cyril modifie aussi les pages à la main. Ne réécris pas ce qu'il a écrit sauf s'il le demande ; complète, structure, améliore.

TYPES DE PAGES ET CHAMPS (data)
- cover : eyebrow (ex. "Proposition · Client"), title, sub, date, right (mention à droite), img {hint}
- section : n ("01"), title, sub — intercalaire de partie

- full : img {hint}, cap (légende)
- g2 : a {hint}, b {hint}, ca, cb (légendes) — g4 : a,b,c,d {hint}, ca,cb,cc,cd
- CASES PHOTO (img, a, b, c, d, below) : {hint, ratio}. ratio = "fill" (remplit l'espace, défaut), "photo" (proportions réelles de la photo, sans recadrage) ou "L:H" (ex. "17:2" panoramique très large, "3:1", "3:2", "16:9", "4:5"). Choisis le ratio quand le texte parle d'un format précis.
- PHOTO SOUS LE TEXTE : les pages text, list et table acceptent un champ below = case photo {hint, ratio} placée sous le contenu, qui occupe l'espace libre. below: null la retire (refusé si Cyril y a mis une photo).
- list : eyebrow, title, items [{t: point, d: précision}]
- table : eyebrow, title, cols [noms de colonnes], rows [[cellules]] (une ligne commençant par "Total" est mise en gras), note
- script : eyebrow (ex. "Séquence 2"), title, rows [{tc: durée ou timecode, img: ce qu'on voit, son: ce qu'on entend}]
- fig : eyebrow, title, n1,l1,n2,l2,n3,l3 (chiffre + libellé)
- quote : q, who, role
- contact : title

OUTIL edit_dossier — opérations
- add_page {type, data, after?, id?} : after = id de la page précédente ("start" pour la mettre en tête ; absent = à la fin avant le contact). id = identifiant court que tu choisis si tu veux y faire référence ensuite dans le même appel.
- update_page {id, data} : seuls les champs fournis changent (pour items/rows/cols, fournis le tableau complet).
- delete_page {id} · move_page {id, after} · set_title {title} (titre du dossier, affiché en pied de page)

const TOOL={name:"edit_dossier",description:"Modifie le dossier affiché à Cyril. Les opérations s'appliquent dans l'ordre et le rendu est immédiat.",
 input_schema:{type:"object",properties:{actions:{type:"array",items:{type:"object",properties:{
  op:{type:"string",enum:["add_page","update_page","delete_page","move_page","set_title"]},
  id:{type:"string",description:"id de la page visée ; pour add_page, id facultatif choisi par toi"},
  type:{type:"string",enum:Object.keys(TYPES)},
  data:{type:"object",description:"Champs de la page. update_page : seulement les champs à changer."},
  after:{type:"string",description:"id de la page après laquelle placer (add/move) ; 'start' = en tête"},
  title:{type:"string"}},required:["op"]}}},required:["actions"]}};

function applyActions(actions){const log=[],touched=new Set();
  for(const a of actions||[]){try{
    if(a.op==="add_page"){if(!TYPES[a.type]){log.push(`add_page : type inconnu ${a.type}`);continue}
      const pg=P_(a.type);if(a.id&&!PG(a.id))pg.id=String(a.id);const d=a.data||{};if(pg.data.body!==undefined&&d.body!==undefined)d.body=toRich(d.body);
      deepMerge(pg.data,d);S.pages.splice(insertIndex(a.after,a.type),0,pg);touched.add(pg.id);log.push(`page ${pg.id} (${a.type}) ajoutée`)}
    else if(a.op==="update_page"){const p=PG(a.id);if(!p){log.push(`update_page : id ${a.id} introuvable`);continue}
      const d={...(a.data||{})};if(d.body!==undefined)d.body=toRich(d.body);
      for(const key in d){const cur=p.data[key];if(cur&&typeof cur==="object"&&"src" in cur&&d[key]&&typeof d[key]==="object"){d[key]={hint:d[key].hint??cur.hint,ratio:d[key].ratio??cur.ratio}}}
      if(d.below===null&&p.data.below&&p.data.below.src){delete d.below;log.push(`below de ${p.id} conservé : il contient une photo de Cyril`)}
      if(d.below===null){delete d.below;delete p.data.below}
      if(d.below&&typeof d.below==="object"&&!p.data.below)p.data.below=img();
      deepMerge(p.data,d);touched.add(p.id);log.push(`page ${p.id} mise à jour`)}
    else if(a.op==="delete_page"){const i=S.pages.findIndex(p=>p.id===a.id);if(i<0){log.push(`delete_page : id ${a.id} introuvable`);continue}
      if(Object.values(S.pages[i].data).some(v=>v&&v.src)){log.push(`page ${a.id} non supprimée : elle contient des photos de Cyril`);continue}
      S.pages.splice(i,1);log.push(`page ${a.id} supprimée`)}
    else if(a.op==="move_page"){const i=S.pages.findIndex(p=>p.id===a.id);if(i<0){log.push(`move_page : id ${a.id} introuvable`);continue}
      const [pg]=S.pages.splice(i,1);S.pages.splice(insertIndex(a.after,pg.type),0,pg);touched.add(pg.id);log.push(`page ${pg.id} déplacée`)}
    else if(a.op==="set_title"&&a.title){S.title=a.title;log.push("titre changé")}
  }catch(err){log.push("erreur : "+err.message)}}
  return {log,touched}}

async function callAPI(messages,overflow){
  const key=pref.get("ccs_key");const model=pref.get("ccs_model")||"claude-sonnet-5-5";
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model,max_tokens:8000,system:systemPrompt(overflow),tools:[TOOL],messages})});
  if(!r.ok){let m="";try{const j=await r.json();m=j.error?.message||""}catch(e){}
    if(r.status===401)throw new Error("Clé API refusée. Vérifie-la dans Réglages.");
    if(r.status===404||/model/i.test(m))throw new Error("Modèle introuvable ("+model+"). Change de modèle dans Réglages.");
    if(r.status===429||r.status===529)throw new Error("Claude est saturé pour le moment. Réessaie dans une minute.");
    throw new Error("Erreur "+r.status+(m?" : "+m:""))}
  return r.json()}

async function send(){
  if(busy)return;const text=$("#inp").value.trim();if(!text&&!attach.length)return;
  if(!pref.get("ccs_key")){renderChat();toast("Ajoute d'abord ta clé API");return}
  const files=attach.slice();attach=[];renderAtt();$("#inp").value="";$("#inp").style.height="";
  const shown=text+(files.length?`\n📎 ${files.map(f=>f.name).join(", ")}`:"");
  // historique texte des échanges précédents
  const hist=[];for(const m of (S.chat||[]).filter(m=>!m.err).slice(-24)){if(m.role==="user")hist.push({role:"user",content:m.text});else hist.push({role:"assistant",content:m.text+(m.did?`\n(${m.did})`:"")})}
  while(hist.length&&hist[0].role!=="user")hist.shift();
  S.chat.push({role:"user",text:shown});busy=true;renderChat();
  const content=[...files.map(f=>f.block),{type:"text",text:text||"Voici des documents pour le dossier."}];
  const msgs=[...hist,{role:"user",content}];
  let said=[],allTouched=new Set(),nOps=0;
  try{
    for(let step=0;step<8;step++){
      const res=await callAPI(msgs,checkOverflow());
      const blocks=res.content||[];said.push(...blocks.filter(b=>b.type==="text").map(b=>b.text));
      const uses=blocks.filter(b=>b.type==="tool_use");
      msgs.push({role:"assistant",content:blocks});
      if(!uses.length||res.stop_reason!=="tool_use")break;
      const results=[];
      for(const u of uses){const {log,touched}=applyActions(u.input&&u.input.actions);touched.forEach(t=>allTouched.add(t));nOps+=(u.input?.actions||[]).length;
        render(touched);save();await new Promise(r=>setTimeout(r,60));const ov=checkOverflow();
        results.push({type:"tool_result",tool_use_id:u.id,content:log.join(" · ")+(ov.length?` · ATTENTION, pages qui débordent : ${ov.join(", ")}`:" · aucune page ne déborde")})}
      msgs.push({role:"user",content:results});
    }
    const first=S.pages.find(p=>allTouched.has(p.id));
    if(first)document.querySelector(`.sheet-wrap[data-id="${first.id}"]`)?.scrollIntoView({behavior:"smooth",block:"start"});
    S.chat.push({role:"assistant",text:said.join("\n\n").trim()||"C'est fait.",did:nOps?`${allTouched.size} page${allTouched.size>1?"s":""} modifiée${allTouched.size>1?"s":""}`:""});
  }catch(err){S.chat.push({role:"assistant",text:err.message||"Connexion impossible. Vérifie ta connexion internet.",err:true})}
  busy=false;renderChat();save()}

/* démarrage */
(function shade(){try{const c=document.createElement("canvas");c.width=8;c.height=512;const x=c.getContext("2d");const im=x.createImageData(8,512);
  for(let y=0;y<512;y++){const t=y/511;const a=Math.round(255*0.66*(t*t*(3-2*t)));for(let i=0;i<8;i++){const k=(y*8+i)*4;im.data[k]=0;im.data[k+1]=0;im.data[k+2]=0;im.data[k+3]=a}}
  x.putImageData(im,0,0);document.documentElement.style.setProperty("--shade",`url(${c.toDataURL("image/png")})`)}catch(e){}})();
(async()=>{await DB.open();saved=await DB.get();if(saved)saved=normalize(saved);showStart()})();
</script>
